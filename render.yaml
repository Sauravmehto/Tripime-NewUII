# Render Blueprint — connect this monorepo on Render (optional).
# Manual setup also works: Root Directory = backend (see README / RENDER_ENV.txt).

services:
  - type: web
    name: tripime-api
    runtime: python
    rootDir: backend
    buildCommand: python scripts/render_build.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN_TTL_HOURS
        value: "12"
      - key: CORS_ORIGINS
        sync: false
        # Set to your Netlify site, e.g. https://tripimee.netlify.app
