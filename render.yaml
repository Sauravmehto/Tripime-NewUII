# Render Blueprint — connect this monorepo on Render (optional).
# Manual setup also works: Root Directory = backend (see README / RENDER_ENV.txt).

services:
  - type: web
    name: tripime-api
    runtime: python
    rootDir: backend
    buildCommand: python scripts/render_build.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: CUSTOMER_JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: ADMIN_TOKEN_TTL_HOURS
        value: "12"
      - key: CORS_ORIGINS
        sync: false
        # Set to your Netlify site, e.g. https://tripimee.netlify.app
      # --- Persistence: NOT enabled (both options need a paid plan). See docs/PERSISTENCE.md ---
      # Until one is configured, admin edits and customer records are lost on every restart/redeploy.
      # Option A - persistent disk (single instance): add a disk below and the DATA_DIR variable.
      #   - key: DATA_DIR
      #     value: /var/data
      # Option B - PostgreSQL for the website CMS: add DATABASE_URL (a secret, never commit a value).
      #   - key: DATABASE_URL
      #     sync: false
    # disk:
    #   name: tripime-data
    #   mountPath: /var/data
    #   sizeGB: 1
